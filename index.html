<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🎮 Ian 的游戏厅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh; color: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 0%, #1b2050, #070713 70%);
    padding: 40px 20px 60px; text-align: center;
    -webkit-user-select: none; user-select: none;
  }
  h1 {
    font-size: clamp(34px, 8vw, 70px); font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg,#ffd34e,#ff5e9c,#5ec8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(255,120,200,.35);
  }
  .sub { margin-top: 10px; font-size: clamp(15px,4vw,22px); color: #aab6ee; }
  .grid {
    margin: 40px auto 0; max-width: 900px;
    display: grid; gap: 22px;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  }
  .card {
    display: block; text-decoration: none; color: #fff;
    border-radius: 24px; padding: 28px 20px;
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border: 2px solid rgba(255,255,255,.12);
    box-shadow: 0 12px 30px rgba(0,0,0,.4);
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .card:active { transform: scale(.96); }
  .card:hover { transform: translateY(-4px); border-color: rgba(255,211,78,.6); box-shadow: 0 18px 40px rgba(0,0,0,.5); }
  .card .ico { font-size: 64px; line-height: 1; }
  .card .name { margin-top: 14px; font-size: 26px; font-weight: 800; }
  .card .desc { margin-top: 8px; font-size: 15px; color: #c2ccf2; line-height: 1.6; min-height: 48px; }
  .card .play {
    display: inline-block; margin-top: 16px; padding: 10px 28px; border-radius: 40px;
    font-weight: 800; font-size: 17px; color: #061018;
    background: linear-gradient(90deg,#ffd34e,#ff8a3d);
  }
  /* 即将推出的占位卡片 */
  .card.soon { opacity: .5; pointer-events: none; }
  .card.soon .play { background: #555; color: #ccc; }
  footer { margin-top: 50px; color: #5a6699; font-size: 13px; }
</style>
</head>
<body>
  <h1>🎮 Ian 的游戏厅</h1>
  <div class="sub">点一个游戏开始玩吧！</div>

  <div class="grid">
    <a class="card" href="space-hero/">
      <div class="ico">🚀</div>
      <div class="name">太空英雄</div>
      <div class="desc">拖动飞船自动开火，闯过 3 关打败大 Boss！可选飞机和颜色。</div>
      <span class="play">开始玩 ▶</span>
    </a>

    <!-- 以后新游戏照这个格式再加一张 .card 就行 -->
    <div class="card soon">
      <div class="ico">✨</div>
      <div class="name">敬请期待</div>
      <div class="desc">更多好玩的游戏正在路上……</div>
      <span class="play">即将推出</span>
    </div>
  </div>

  <footer>用 iPad Safari 打开，点「分享 → 添加到主屏幕」即可像 App 一样玩 🎉</footer>
</body>
</html>
